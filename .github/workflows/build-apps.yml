# Builds the LAMBA Windows installer (.exe) and Android app (.apk) on GitHub's free build machines.
#
# It runs automatically when you push code changes, or manually:
#   Actions tab → "Build LAMBA apps" → "Run workflow".
# When it finishes (~10 min), download the files from the run's "Artifacts" section.
# Every successful build also puts both files on the repo's Releases page (easy download page).
#
# Optional, for a signed release APK + Play Store bundle (.aab), add these repository secrets
# (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   base64 of your .jks/.keystore file
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
name: Build LAMBA apps

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - '**.txt'

permissions:
  contents: write

# A new push cancels older runs still in progress.
concurrency:
  group: build-apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows installer (.exe)
    # Built natively on Windows: no Wine needed. The LAMBA icon and version details are
    # stamped into LAMBA.exe by desktop/scripts/after-pack.cjs.
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm run setup
      - name: Build the web app for desktop
        run: npm run build --prefix client -- --mode desktop
      - name: Build installer
        # electron-builder on Windows scans files outside the app folder and stops at the
        # repo's other files (e.g. chapter1.txt). So build in a clean folder of its own.
        run: |
          set -o pipefail
          REPO="$(pwd)"
          TMP="$(cygpath -u "$RUNNER_TEMP")"
          npm run prepare-app --prefix desktop
          mkdir -p "$TMP/lamba-build"
          cp -r desktop "$TMP/lamba-build/desktop"
          cd "$TMP/lamba-build/desktop"
          npm ci
          npx electron-builder --win nsis --x64 --publish never 2>&1 | tee "$TMP/build-installer.log"
          mkdir -p "$REPO/desktop/release"
          cp release/LAMBA-Setup-*.exe "$REPO/desktop/release/"
      - name: Report installer build error
        if: failure()
        run: |
          # Put the end of the log on the run's summary page so the error is easy to see.
          LOG="$(cygpath -u "$RUNNER_TEMP")/build-installer.log"
          [ -f "$LOG" ] || { echo "::error title=Installer build failed::No build log was written; see the step above."; exit 0; }
          tail -n 60 "$LOG" | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}' > "$RUNNER_TEMP/tail.txt"
          echo "::error title=Installer build failed::$(cat "$RUNNER_TEMP/tail.txt")"
      - uses: actions/upload-artifact@v5
        with:
          name: LAMBA-Windows-Installer
          path: desktop/release/LAMBA-Setup-*.exe
          if-no-files-found: error

  android:
    name: Android app (.apk)
    # Ubuntu 24.04 images come with the Android SDK preinstalled (ANDROID_HOME is set).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Secrets can't be tested directly in `if:`, so expose this one as an env var.
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"
      - name: Install dependencies
        run: npm run setup
      - name: Build the web app and copy it into the Android project
        run: npm run android:sync --prefix client
      - name: Build debug APK (installable on any Android phone)
        working-directory: client/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          mkdir -p ../../dist-apps
          cp app/build/outputs/apk/debug/app-debug.apk ../../dist-apps/LAMBA.apk
      - name: Build signed release APK + AAB (only if signing secrets are set)
        if: ${{ env.KEYSTORE_B64 != '' }}
        working-directory: client/android
        env:
          LAMBA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LAMBA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LAMBA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/lamba.keystore"
          export LAMBA_KEYSTORE_PASSWORD LAMBA_KEY_ALIAS LAMBA_KEY_PASSWORD
          LAMBA_KEYSTORE_PATH="$RUNNER_TEMP/lamba.keystore" ./gradlew assembleRelease bundleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../../dist-apps/LAMBA-release.apk
          cp app/build/outputs/bundle/release/app-release.aab ../../dist-apps/LAMBA-release.aab
      - uses: actions/upload-artifact@v5
        with:
          name: LAMBA-Android
          path: dist-apps/*
          if-no-files-found: error

  release:
    # Publishes both files on the repo's Releases page — an easy download page that also
    # works on phones. Normal pushes update the "latest-build" release; tags like v1.0.0
    # create a release of their own.
    name: Publish download page (GitHub Release)
    needs: [windows, android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true
      - name: Choose release name
        id: rel
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "name=LAMBA $GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest-build" >> "$GITHUB_OUTPUT"
            echo "name=LAMBA — latest build" >> "$GITHUB_OUTPUT"
          fi
          ls -la artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: ${{ steps.rel.outputs.name }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: artifacts/*
          body: |
            ## Download LAMBA

            **Windows:** download `LAMBA-Setup-1.0.0.exe` below and run it.
            If Windows shows "Windows protected your PC", click **More info → Run anyway** (the installer isn't code-signed yet).

            **Android:** download `LAMBA.apk` below on your phone, tap it, and allow "Install unknown apps" when asked.

            Built from commit ${{ github.sha }}.
