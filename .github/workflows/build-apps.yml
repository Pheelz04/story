# Builds the LAMBA Windows installer (.exe) and Android app (.apk) on GitHub's free build machines.
#
# How to use:
#   1. Push this project to a GitHub repository.
#   2. Open the repo's "Actions" tab → "Build LAMBA apps" → "Run workflow".
#   3. When it finishes (~10 min), download the files from the run's "Artifacts" section.
#   Pushing a tag like v1.0.0 also publishes both files on a GitHub Release page.
#
# Optional, for a signed release APK + Play Store bundle (.aab), add these repository secrets
# (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   base64 of your .jks/.keystore file
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
name: Build LAMBA apps

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm run setup
      - name: Build the web app for desktop
        run: npm run build --prefix client -- --mode desktop
      - name: Install Electron
        run: npm install --prefix desktop
      - name: Build installer
        run: npm run dist:win --prefix desktop
      - uses: actions/upload-artifact@v4
        with:
          name: LAMBA-Windows-Installer
          path: desktop/release/LAMBA-Setup-*.exe
          if-no-files-found: error

  android:
    name: Android app (.apk)
    runs-on: ubuntu-latest
    env:
      # Secrets can't be tested directly in `if:`, so expose this one as an env var.
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install dependencies
        run: npm run setup
      - name: Build the web app and copy it into the Android project
        run: npm run android:sync --prefix client
      - name: Build debug APK (installable on any Android phone)
        working-directory: client/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          mkdir -p ../../dist-apps
          cp app/build/outputs/apk/debug/app-debug.apk ../../dist-apps/LAMBA.apk
      - name: Build signed release APK + AAB (only if signing secrets are set)
        if: ${{ env.KEYSTORE_B64 != '' }}
        working-directory: client/android
        env:
          LAMBA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LAMBA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LAMBA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/lamba.keystore"
          export LAMBA_KEYSTORE_PASSWORD LAMBA_KEY_ALIAS LAMBA_KEY_PASSWORD
          LAMBA_KEYSTORE_PATH="$RUNNER_TEMP/lamba.keystore" ./gradlew assembleRelease bundleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../../dist-apps/LAMBA-release.apk
          cp app/build/outputs/bundle/release/app-release.aab ../../dist-apps/LAMBA-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: LAMBA-Android
          path: dist-apps/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
