<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0b10" />
  <title>LAMBA — Offline</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0b10; color: #f4f3fa; font: 16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; text-align: center; padding: 24px; }
    img { width: 160px; margin: 0 auto 28px; display: block; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { color: #8f8da3; margin: 0 0 24px; }
    button { height: 44px; padding: 0 22px; border: 0; border-radius: 999px; color: #fff; font-weight: 600; font-size: 15px; cursor: pointer; background: linear-gradient(120deg, #7c3aed, #a855f7 45%, #ffb547); }
  </style>
</head>
<body>
  <main>
    <img src="/lamba-logo-light.png" alt="LAMBA" />
    <h1>You’re offline</h1>
    <p>Check your connection, then try again.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
